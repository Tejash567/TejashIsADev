<style>
:root{--bg:#2A2926;--surf:#1F1E1C;--hd:#363431;--deep:#171614;--ghost:#252421;--ink:#F0EDE6;--mute:#A29E94;--line:#44413C;--acc:#FFB020;--onacc:#1A1405;

color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#EFECE5;--surf:#FBFAF7;--hd:#FBFAF7;--deep:#E0DCD2;--ghost:#E8E4DB;--ink:#1B1A17;--mute:#6A665D;--line:#D8D3C8;--acc:#B84E00;--onacc:#fff;color-scheme:light}


*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans);transition:background .3s,color .3s;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:30}
a{color:inherit;text-decoration:none}
h1,h3{font-family:var(--fh)}
h2,.big{font-family:var(--fh);font-weight:700;letter-spacing:-.03em}

.wrap{max-width:1360px;margin:0 auto;padding:0 clamp(24px,5vw,64px)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hd);border-bottom:1px solid var(--line);transition:background .3s}
#pg{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--acc)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font:800 22px var(--fh);letter-spacing:-.04em;display:flex;align-items:center;gap:10px}
.logo.cf #lg{font-family:LogoFont,var(--fh);font-weight:400;font-size:30px;letter-spacing:.01em;line-height:1}
@media (max-width:520px){.logo.cf #lg{font-size:22px}}
.logo i{width:32px;height:32px;display:grid;place-items:center;overflow:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.logo i:empty{display:none}
.logo:hover i{transform:rotate(-12deg) scale(1.08)}
.logo i img{width:100%;height:100%;object-fit:contain}
.cur #lg::after{content:"";display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--acc);margin-left:4px;animation:bl 1.1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
nav{display:flex;align-items:center;gap:4px}
nav a{padding:8px 12px;border-radius:8px;font-size:14px;color:var(--mute);transition:background .2s,color .2s}
nav a:hover{background:var(--surf);color:var(--ink)}
nav a.pillb,nav a.pillb:hover{background:var(--acc);color:var(--onacc);padding:8px 18px;border-radius:99px;font-weight:500;margin-left:4px}
nav a.pillb:hover{opacity:.88}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;font:16px var(--sans);transition:background .2s,transform .3s}
.ib:hover{background:var(--surf);transform:rotate(25deg)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.eyebrow{font:500 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
h1{font-size:clamp(52px,min(11vw,20vh),168px);line-height:.95;letter-spacing:-.045em;margin:20px 0 24px;font-weight:800}
h2{font-size:clamp(34px,4.6vw,60px);margin:8px 0 40px;line-height:1.1}
h3{font-size:18px;margin:0;font-weight:500}
.mute{color:var(--mute)}
.hi{font:400 .62em var(--hif);color:var(--acc);margin-left:.5em;letter-spacing:0;white-space:nowrap}
.hi:empty{display:none}
section{padding:88px 0}
#journey,#contact{min-height:calc(100svh - 65px - env(safe-area-inset-top,0px));display:flex;align-items:center}
#journey>.wrap,#contact>.wrap{width:100%}
#work{padding-top:40px}
#work h2{margin-bottom:24px}
html{scroll-snap-type:y mandatory}
.hero,#work,#journey,#contact{scroll-snap-align:start}
.pr+.pr,#more{scroll-snap-align:center}
footer{scroll-snap-align:end}
@media (max-width:899px),(max-height:639px){html{scroll-snap-type:y proximity}}
.hero{min-height:calc(100svh - 65px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;padding:0;background:var(--deep);position:relative;overflow:hidden}
.hin{flex:1;display:flex;flex-direction:column;justify-content:center;padding-top:32px;padding-bottom:32px}
.hero .wrap{position:relative;z-index:1}
.ghost{position:absolute;left:50%;bottom:calc(70px - .2em);transform:translateX(-50%);font:800 clamp(140px,34vw,560px)/.8 var(--fh);letter-spacing:-.06em;color:var(--ghost);white-space:nowrap;pointer-events:none;user-select:none;animation:gh 1.4s cubic-bezier(.2,.8,.2,1)}

@keyframes gh{from{opacity:0;transform:translateX(-50%) translateY(30%)}}
.role{font-size:clamp(16px,2vw,22px);color:var(--mute);margin:0 0 36px}

.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em}
.w span{display:inline-block;transform:translateY(110%);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.12s + .1s)}

.cta{display:flex;justify-content:space-between;align-items:center;max-width:760px;height:60px;padding:0 24px;margin-bottom:0;background:var(--surf);border-radius:14px;color:var(--mute);font-size:18px;transition:transform .25s}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 24px;border-radius:24px;font:500 15px var(--sans);cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);transition:transform .2s,border-color .2s,opacity .2s}

.btn.p{background:var(--acc);border-color:var(--acc);color:var(--onacc)}

.mq{background:var(--surf);border-block:1px solid var(--line);overflow:hidden;padding:22px 0;position:relative;z-index:2;flex:none}

.pr{display:grid;grid-template-columns:1fr 1.3fr;gap:clamp(40px,6vw,96px);align-items:center;padding:clamp(20px,3vw,44px);margin-bottom:24px;background:var(--surf);border:1px solid var(--line);border-radius:28px}

.pr.in .stk{opacity:1;transform:none}
.chip{display:inline-block;font:500 13px var(--sans);padding:5px 12px;border-radius:99px;background:var(--bg);color:var(--mute)}

.tx p{margin:0 0 28px;color:var(--mute);font-size:18px;max-width:440px}
.ctl{display:flex;align-items:center;gap:12px;margin-top:28px}

.cnt{font:500 14px var(--sans);color:var(--mute);min-width:56px;text-align:center}
.hint{font-size:13px;color:var(--mute);margin-top:12px}
.hint b{display:inline-block;color:var(--acc);animation:nd 1.6s ease-in-out infinite}

.stk{position:relative;aspect-ratio:4/3;width:min(100%,max(320px,calc((100svh - 360px)*1.3333)));justify-self:end;margin:0 36px 36px 0;touch-action:pan-y;cursor:grab;user-select:none;outline:none}
.pr.alt .stk{justify-self:start;margin:0 0 36px 36px}
.stk:active{cursor:grabbing}
.sc{position:absolute;inset:0;border-radius:20px;overflow:hidden;background:var(--deep);border:1px solid var(--line);transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s}
.sc::before{content:"";position:absolute;left:0;right:0;top:0;height:30px;background:var(--hd);border-bottom:1px solid var(--line);z-index:2}
.sc::after{content:"";position:absolute;left:14px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--mute);opacity:.6;box-shadow:14px 0 var(--mute),28px 0 var(--mute);z-index:3}
.sc img{width:100%;height:calc(100% - 30px);margin-top:30px;object-fit:cover;display:block;pointer-events:none}
.ph{width:100%;height:100%;padding-top:30px;display:grid;place-items:center;font:500 14px var(--sans);color:var(--mute)}
.ph span{padding:8px 14px;border:1px dashed var(--mute);border-radius:8px}
.cap{position:absolute;left:12px;right:12px;bottom:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px;font-weight:500;display:flex;gap:10px}
.cap i{width:8px;height:8px;border-radius:50%;background:var(--acc);margin-top:8px;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:10px;padding:24px;background:var(--surf);border:1px solid var(--line);border-radius:16px;transition:transform .3s,border-color .3s}
.card:hover{border-color:var(--acc)}
.card p{margin:0;color:var(--mute);font-size:15px}
.card h3{font:700 24px var(--fh);letter-spacing:-.02em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.tl{border-left:2px solid var(--line);padding-left:24px;display:flex;flex-direction:column;gap:28px}
.tl>div{position:relative}
.tl>div::before{content:"";position:absolute;left:-31px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--acc);transition:background .3s}
.tl>div:hover::before{background:var(--acc)}
.tl small{font-size:13px;color:var(--mute)}
.contact{background:var(--surf);border:1px solid var(--line);border-radius:24px;padding:clamp(24px,4vw,48px);display:grid;grid-template-columns:1fr 1fr;gap:40px}
.list{display:flex;flex-direction:column;margin-top:16px}
.list a,.list>span{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;transition:color .2s}
.list a:hover{color:var(--acc)}
form{display:flex;flex-direction:column;gap:12px}
input,textarea,select{font:400 15px var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%;transition:border-color .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc)}
textarea{min-height:110px;resize:vertical}
footer{background:var(--deep);padding:32px 0;font-size:13px;color:var(--mute)}
footer .wrap{display:flex;justify-content:space-between}
.rv{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--d,0)*.08s)}
.rv.in{opacity:1;transform:none}
.card.rv.in:hover{transform:translateY(-6px)}
/* admin */
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.ov.on{display:block}
.box{max-width:420px;margin:12vh auto 0;display:flex;flex-direction:column;gap:12px}
.adm{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:200px 1fr;gap:32px;align-items:start}
.sb{position:sticky;top:0;display:flex;flex-direction:column;gap:6px}
.tab{text-align:left;font:500 15px var(--sans);padding:10px 14px;border-radius:10px;border:0;background:transparent;color:var(--mute);cursor:pointer}

.sp{height:16px}
.pn{display:flex;flex-direction:column;gap:14px;min-width:0}
.pn h2{font-size:36px;margin:0}
.pn h3{margin-top:12px}
.pn label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.pn label.ck{flex-direction:row;align-items:center;gap:8px}
.pn label.ck input{width:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sub,.pc{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.pc summary{cursor:pointer;display:flex;justify-content:space-between;gap:12px;list-style:none}
.pc summary em{font-style:normal;font-size:12px;color:var(--acc)}

.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.sh{background:var(--bg);border-radius:12px;padding:10px;display:grid;gap:8px}

.sm{height:36px;padding:0 14px;font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.cp{display:inline-flex;align-items:center;gap:6px;background:var(--surf);border:1px solid var(--line);border-radius:99px;padding:6px 6px 6px 14px;font-size:14px}

@media (max-width:760px){.two,.contact,.pr,.adm,.g2{grid-template-columns:1fr}.pr{gap:32px}.pr.alt .tx{order:0}nav a.h{display:none}section{padding:64px 0}.sb{position:static;flex-direction:row;flex-wrap:wrap}.role{white-space:normal}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.pr .stk{opacity:1;transform:none}.w span{transform:none}}
</style>
</head>

  $("eb2").innerHTML='<div class="adm"><aside class="sb"><div class="eyebrow" style="margin:0 14px 8px">Dashboard</div>'+TABS.map(function(t){return '<button class="tab'+(t[0]===tab?" on":"")+'" data-tab="'+t[0]+'" type="button">'+t[1]+'</button>'}).join("")+'<div class="sp"></div><button class="btn sm" data-close type="button">View site</button><button class="btn sm" id="lg2" type="button">Log out</button></aside><div class="pn"><div class="row" style="justify-content:space-between"><h2>'+TABS.filter(function(t){return t[0]===tab})[0][1]+'</h2><span class="msg" id="sm">Changes save automatically.</span></div>'+panel()+'</div></div>'}
function note(m){var e=$("sm");if(e)e.textContent=m}
var pt=null;
function persist(){var ok=sv(KEY,JSON.stringify(D));render();
  if(CLOUD&&SBS){note("Saving…");clearTimeout(pt);pt=setTimeout(function(){sbPush().then(function(){note("Saved to cloud ✓")}).catch(function(e){note("Cloud save failed — "+(e&&e.message?e.message.slice(0,150):"sign in again"))})},700);return}
  note(ok?"Saved ✓":"Storage full — use smaller images.")}
function path(p){var a=p.split("."),o=D;for(var i=0;i<a.length-1;i++)o=o[a[i]];return[o,a[a.length-1]]}
function shrink(f,max,type,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(type,.82))};im.src=r.result};r.readAsDataURL(f)}
var ae=$("ae");
function addSkill(){var v=$("ns").value.trim();if(v){D.skills.push(v);persist();buildEd()}}
ae.addEventListener("input",function(e){var t=e.target;
  if(t.id==="sp"){D.showPhone=t.checked;persist()}
  else if(t.id==="cu"){D.cursor=t.checked;persist()}else if(t.id==="sg"){D.showGhost=t.checked;persist()}else if(t.id==="hon"){D.hiOn=t.checked;persist()}else if(t.id==="ac"){D.acc=t.value;persist()}
  else if(t.dataset.f){D[t.dataset.f]=t.value;persist()}
  else if(t.dataset.p){var r=path(t.dataset.p);r[0][r[1]]=t.value;persist()}});
ae.addEventListener("keydown",function(e){if(e.target.id==="ns"&&e.key==="Enter"){e.preventDefault();addSkill()}});
ae.addEventListener("toggle",function(e){var d=e.target;if(d.dataset&&d.dataset.i!=null)OP[d.dataset.i]=d.open},true);
ae.addEventListener("change",function(e){var t=e.target;if(!t.files||!t.files[0])return;
  if(t.hasAttribute("data-lf")){if(CLOUD&&SBS)up(t.files[0],"font-"+t.files[0].name,function(u){D.logoFont=u;persist();buildEd()});else{var fr=new FileReader();fr.onload=function(){D.logoFont=fr.result;persist();buildEd()};fr.readAsDataURL(t.files[0])}}else if(t.hasAttribute("data-logo"))shrink(t.files[0],160,"image/png",function(u){up(u,"logo.png",function(v){D.logoImg=v;persist();buildEd()})});
  else if(t.dataset.up){var ij=t.dataset.up.split(".");shrink(t.files[0],1000,"image/jpeg",function(u){up(u,"shot.jpg",function(v){D.projects[ij[0]].shots[ij[1]].img=v;persist();buildEd()})})}});
ae.addEventListener("click",function(e){var t=e.target;
  if(t.dataset.tab){tab=t.dataset.tab;if(tab==="messages"){MSG=null;loadMsgs()}buildEd()}
  else if(t.dataset.add){var a=t.dataset.add.split("."),last=a[a.length-1],arr=D;a.forEach(function(k){arr=arr[k]});
    arr.push(last==="shots"?{img:"",cap:""}:last==="projects"?{name:"New project",tag:"Web App",desc:"",link:"",shots:[]}:{title:"",place:"",when:""});
    if(last==="projects")OP[arr.length-1]=true;persist();buildEd()}
  else if(t.dataset.rm){if(/^projects\.\d+$/.test(t.dataset.rm)&&!confirm("Delete this project?"))return;var b=t.dataset.rm.split("."),ix=+b.pop(),ar=D;b.forEach(function(k){ar=ar[k]});ar.splice(ix,1);if(b.length===1&&b[0]==="projects")OP={};persist();buildEd()}
  else if(t.dataset.mv){var q=t.dataset.mv.split("|"),c=q[0].split("."),i0=+c.pop(),ar2=D;c.forEach(function(k){ar2=ar2[k]});var i1=i0+ +q[1];if(i1<0||i1>=ar2.length)return;var tmp=ar2[i0];ar2[i0]=ar2[i1];ar2[i1]=tmp;if(c.length===1&&c[0]==="projects"){OP={};OP[i1]=true}persist();buildEd()}
  else if(t.dataset.dm){delMsg(t.dataset.dm)}
  else if(t.id==="as")addSkill();
  else if(t.id==="ar"){D.acc="";persist();buildEd()}
  else if(t.id==="rf"){D.logoFont="";persist();buildEd()}else if(t.id==="rl"){D.logoImg="";persist();buildEd()}
  else if(t.id==="rs"){if(confirm("Discard local edits and use the published data?")){D=JSON.parse(JSON.stringify(BASE));try{localStorage.removeItem(KEY)}catch(x){}render();buildEd()}}
  else if(t.id==="lg2"){authed=false;SBS=null;sbSaveSess();closeAd()}
  else if(t.id==="cp"){if(CLOUD){note("Change your password in Supabase → Authentication → Users.");return}var v=$("np").value;if(v.length<6){note("Use at least 6 characters.");return}sha(v).then(function(h){sv(PK,h);$("np").value="";note("Password changed ✓")})}
  else if(t.id==="ex2"){var bl=new Blob([JSON.stringify(D)],{type:"application/json"}),l=document.createElement("a");l.href=URL.createObjectURL(bl);l.download="data.json";l.click()}
  else if(t.id==="im"){var inp=document.createElement("input");inp.type="file";inp.accept=".json";inp.onchange=function(){var r=new FileReader();r.onload=function(){try{D=Object.assign({},DEF,JSON.parse(r.result));persist();buildEd()}catch(x){note("Invalid file.")}};r.readAsText(inp.files[0])};inp.click()}});
var BASE=JSON.parse(JSON.stringify(DEF));
render();route();
try{fetch("data.json",{cache:"no-cache"}).then(function(r){return r.ok?r.json():null}).then(function(j){if(!j||typeof j!=="object")return;BASE=Object.assign({},DEF,j);var s={};try{s=JSON.parse(ld(KEY)||"{}")}catch(e){}D=Object.assign({},BASE,s);if(!ld(SK))document.documentElement.setAttribute("data-theme",D.theme||"dark");render()}).catch(function(){}).then(loadRemote)}catch(e){loadRemote()}
